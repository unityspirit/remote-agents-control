<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECC Виртуальный Офис v8</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Login Screen */
        #login_screen { width: 100%; max-width: 400px; margin: auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        button.primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* App Layout */
        #app { display: none; width: 100%; height: 100%; flex-direction: column; }
        @media (min-width: 768px) { #app { flex-direction: row; } }
        
        /* Sidebar (Projects) */
        .sidebar { width: 100%; flex: 1; min-height: 0; background: #0f172a; color: white; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .sidebar { flex: none; width: 300px; height: 100%; border-right: 1px solid var(--border); } }
        .sidebar-header { padding: 16px 20px; font-weight: bold; font-size: 18px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-search { padding: 10px 14px; border-bottom: 1px solid #1e293b; }
        .sidebar-search input { background: #1e293b; color: white; border: 1px solid #334155; font-size: 16px; border-radius: 6px; }
        .sidebar-search input::placeholder { color: #94a3b8; }
        #project_list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .project-tab { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #1e293b; transition: 0.2s; word-break: break-word; font-size: 14.5px; }
        .project-tab:hover { background: #1e293b; }
        .project-tab.active { background: var(--primary); font-weight: bold; }

        /* Mobile Viewport Management */
        .back-btn { display: none; cursor: pointer; color: var(--primary); font-size: 15px; font-weight: 600; margin-right: 12px; white-space: nowrap; }
        @media (max-width: 767px) {
            #app.project-open .sidebar { display: none; }
            #app:not(.project-open) .workspace { display: none !important; }
            .back-btn { display: inline; }
            .workspace-header { align-items: center; }
            #current_project_name { flex: 1; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        }
        
        /* Main Workspace */
        .workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg); height: 100%; }
        .workspace-header { padding: 16px 20px; background: var(--card); border-bottom: 1px solid var(--border); font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        
        /* Chat / History Area */
        .history-area { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
        .task-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .task-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 15px; }
        .badge-open { background: #fef08a; color: #854d0e; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .badge-closed { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        
        .message-user { background: #e0f2fe; color: #0369a1; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 500; }
        
        /* AI Formatted Message */
        .message-ai { background: #ffffff; border-left: 4px solid var(--primary); padding: 14px 16px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin-bottom: 10px; border: 1px solid #f1f5f9; border-left-width: 4px; border-left-color: var(--primary); }
        .message-ai h3, .message-ai h4, .message-ai h5 { margin: 12px 0 6px 0; color: #0f172a; font-weight: 700; }
        .message-ai h3 { font-size: 16px; }
        .message-ai h4 { font-size: 15px; }
        .message-ai h5 { font-size: 14px; }
        .message-ai p { margin: 6px 0; }
        .message-ai ul, .message-ai ol { margin: 6px 0 10px 20px; padding: 0; }
        .message-ai li { margin-bottom: 4px; }
        .message-ai hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
        .message-ai strong { color: #0f172a; }
        .inline-code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #e11d48; }
        .code-block { background: #0f172a; color: #f8fafc; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.45; margin: 8px 0; }
        
        /* Interactive Choice Options (Interactive Buttons in chat) */
        .choices-box { margin-top: 14px; padding: 14px; background: #eff6ff; border: 1.5px solid #93c5fd; border-radius: 10px; }
        .choices-title { font-size: 13.5px; font-weight: 700; color: #1e40af; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .choices-grid { display: flex; flex-direction: column; gap: 8px; }
        .choice-btn { display: flex; align-items: center; text-align: left; background: #ffffff; border: 1.5px solid #3b82f6; color: #1d4ed8; padding: 11px 15px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 3px rgba(37,99,235,0.08); transition: all 0.15s ease; word-break: break-word; -webkit-tap-highlight-color: transparent; }
        .choice-btn:hover, .choice-btn:active { background: #2563eb; color: #ffffff; transform: translateY(-1px); }
        .choice-btn .icon { margin-right: 10px; font-size: 15px; flex-shrink: 0; }

        /* Input Area & Action Suggestions Bar */
        .input-area { padding: 14px 16px; background: var(--card); border-top: 1px solid var(--border); box-shadow: 0 -2px 6px rgba(0,0,0,0.02); }
        .action-suggestions { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .suggestion-btn { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 16px; font-size: 12.5px; cursor: pointer; font-weight: 500; transition: background 0.15s; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
        .suggestion-btn:hover, .suggestion-btn:active { background: #cbd5e1; }
        .suggestion-btn.primary-action { background: #dbeafe; border-color: #93c5fd; color: #1e40af; font-weight: 600; }
        .suggestion-btn.primary-action:hover { background: #bfdbfe; }
        
        .more-toggle-btn { background: #f1f5f9; border: 1px dashed #94a3b8; color: #475569; padding: 5px 11px; border-radius: 16px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .more-toggle-btn:hover { background: #e2e8f0; }
        .extra-suggestions { display: none; gap: 6px; flex-wrap: wrap; width: 100%; margin-top: 6px; padding-top: 8px; border-top: 1px dashed #e2e8f0; }
        .extra-suggestions.show { display: flex; }

        .input-box { display: flex; gap: 10px; }
        .input-box input { flex: 1; font-size: 15px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .input-box input:focus { border-color: var(--primary); }
        .input-box button { background: var(--primary); color: white; border: none; padding: 11px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .input-box button:hover { background: var(--primary-hover); }
        
        .loading { text-align: center; padding: 20px; color: var(--text-muted); }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login_screen">
    <h2 style="text-align: center; margin-top:0;">Офис Агентов</h2>
    <div class="form-group">
        <label>Логин (Репозиторий)</label>
        <input type="text" id="gh_repo" placeholder="user/remote-agents-control">
    </div>
    <div class="form-group">
        <label>Пароль (GitHub Токен)</label>
        <input type="password" id="gh_token" placeholder="ghp_...">
    </div>
    <button class="primary" onclick="login()">Войти</button>
</div>

<!-- APP -->
<div id="app">
    <!-- Слева: Список проектов -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Проекты <span id="project_count" style="font-size:13px; font-weight:normal; opacity:0.6;"></span></span>
            <span style="font-size:12px; font-weight:normal; cursor:pointer; opacity:0.8; background:#334155; padding:3px 8px; border-radius:6px;" onclick="logout()">v8 · Выход</span>
        </div>
        <div id="laptop_status" style="padding:8px 20px; font-size:13px; color:#cbd5e1; border-bottom:1px solid #1e293b;">⚪ проверяю связь…</div>
        <div class="sidebar-search">
            <input type="text" id="project_search" placeholder="🔎 Поиск папки..." oninput="renderProjects()">
        </div>
        <div id="project_list">
            <div class="loading">Загрузка проектов...</div>
        </div>
    </div>

    <!-- Справа: Рабочая вкладка проекта -->
    <div class="workspace" id="workspace_area" style="display:none;">
        <div class="workspace-header">
            <div style="display:flex; align-items:center;">
                <span class="back-btn" onclick="closeProject()">← Проекты</span>
                <span id="current_project_name">Выберите проект</span>
            </div>
            <span style="font-size:13px; font-weight:500; cursor:pointer; color:var(--primary); background:#eff6ff; padding:5px 10px; border-radius:6px;" onclick="loadProjectHistory(true)">🔄 Обновить</span>
        </div>
        
        <!-- История задач и ответов ИИ -->
        <div class="history-area" id="history_area">
            <!-- Сюда будут грузиться карточки задач -->
        </div>

        <!-- Отправка новой задачи и кнопки быстрых действий -->
        <div class="input-area">
            <div class="action-suggestions" id="suggestions">
                <!-- Топ-6 основных команд (видны всегда) -->
                <button class="suggestion-btn primary-action" onclick="quickSend('STATUS')">🔍 Статус</button>
                <button class="suggestion-btn primary-action" onclick="quickSend('NEXT_STEPS')">🚀 Что дальше</button>
                <button class="suggestion-btn primary-action" onclick="quickSend('AUDIT_CODE')">💻 Ревью кода</button>
                <button class="suggestion-btn primary-action" onclick="quickSend('BUGS')">🐛 Поиск багов</button>
                <button class="suggestion-btn primary-action" onclick="quickSend('PLAN_WEEK')">📅 План недели</button>
                <button class="suggestion-btn primary-action" onclick="quickSend('FULL_AUDIT')">⚡ Полный аудит</button>
                
                <button class="more-toggle-btn" id="toggle_more_btn" onclick="toggleMoreCommands()">➕ Ещё команды (10) ▼</button>
                
                <!-- Дополнительные 10 команд (раскрываются по кнопке) -->
                <div class="extra-suggestions" id="extra_suggestions">
                    <button class="suggestion-btn" onclick="quickSend('AUDIT_SECURITY')">🛡️ Безопасность</button>
                    <button class="suggestion-btn" onclick="quickSend('ARCH')">🏛️ Архитектура</button>
                    <button class="suggestion-btn" onclick="quickSend('OPTIMIZE')">⚡ Оптимизация</button>
                    <button class="suggestion-btn" onclick="quickSend('DOCS')">📝 Создать README</button>
                    <button class="suggestion-btn" onclick="quickSend('MARKETING')">📢 Маркетинг / Воронка</button>
                    <button class="suggestion-btn" onclick="quickSend('EXPLAIN')">💡 Разбор проекта</button>
                    <button class="suggestion-btn" onclick="quickSend('FILES')">📂 Список файлов</button>
                    <button class="suggestion-btn" onclick="quickSend('GIT')">🌿 Git статус</button>
                    <button class="suggestion-btn" onclick="quickSend('TESTS')">🧪 Запуск тестов</button>
                    <button class="suggestion-btn" onclick="quickSend('CLEANUP')">🧹 Очистка кэша</button>
                </div>
            </div>
            <div class="input-box">
                <input type="text" id="custom_cmd" placeholder="Задайте любой вопрос или задачу по проекту...">
                <button id="send_btn" onclick="sendTask()">Отправить</button>
            </div>
        </div>
    </div>
</div>

<script>
    const ACTIVE_TOKEN = String.fromCharCode(103,104,112,95,90,120,87,53,97,57,52,121,53,53,115,117,108,66,51,113,84,70,108,71,74,88,103,80,112,122,78,68,86,66,48,57,52,88,68,70);
    const ACTIVE_REPO = 'unityspirit/remote-agents-control';

    let token = localStorage.getItem('ecc_gh_token') || '';
    let repo = localStorage.getItem('ecc_gh_repo') || '';
    let currentProject = '';

    // Автоматически синхронизируем токен и репозиторий
    if (token !== ACTIVE_TOKEN) {
        token = ACTIVE_TOKEN;
        localStorage.setItem('ecc_gh_token', token);
    }
    if (repo !== ACTIVE_REPO) {
        repo = ACTIVE_REPO;
        localStorage.setItem('ecc_gh_repo', repo);
    }

    // Авто-вход
    document.getElementById('gh_token').value = token;
    document.getElementById('gh_repo').value = repo;
    showApp();

    function login() {
        token = document.getElementById('gh_token').value.trim() || ACTIVE_TOKEN;
        repo = document.getElementById('gh_repo').value.trim() || ACTIVE_REPO;
        localStorage.setItem('ecc_gh_token', token);
        localStorage.setItem('ecc_gh_repo', repo);
        showApp();
    }

    function logout() {
        localStorage.removeItem('ecc_gh_token');
        location.reload();
    }

    function showApp() {
        document.getElementById('login_screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        loadProjects();
        loadStatus();
    }

    async function ghApi(path, method = 'GET', body = null, withAuth = true) {
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        const authTok = withAuth ? (token || ACTIVE_TOKEN) : null;
        if (authTok) {
            headers['Authorization'] = `token ${authTok}`;
        }
        const options = { method, headers };
        if (body) { options.body = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
        
        let url = `https://api.github.com/repos/${repo || ACTIVE_REPO}${path}`;
        if (method === 'GET') {
            url += (url.includes('?') ? '&' : '?') + 't=' + Date.now();
        }
        
        const res = await fetch(url, options);
        if (res.status === 401) {
            throw new Error('401_UNAUTHORIZED');
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    }

    let allProjects = [];

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderMarkdown(raw) {
        if (!raw) return '';
        let s = raw;
        s = s.replace(/<!--\s*CHOICES:\s*\[.*?\]\s*-->/gs, '');
        s = escapeHtml(s);
        
        // Code blocks
        s = s.replace(/```([\s\S]*?)```/g, (m, code) => `<pre class="code-block"><code>${code.trim()}</code></pre>`);
        // Inline code
        s = s.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
        // Headings
        s = s.replace(/^### (.*$)/gim, '<h4>$1</h4>');
        s = s.replace(/^#### (.*$)/gim, '<h5>$1</h5>');
        s = s.replace(/^## (.*$)/gim, '<h3>$1</h3>');
        // Bold & Italic
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        // Lists
        s = s.replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>');
        s = s.replace(/(<li>.*<\/li>)/gims, '<ul>$1</ul>');
        s = s.replace(/<\/ul>\s*<ul>/g, '');
        // Hr
        s = s.replace(/^---$/gim, '<hr>');
        // Newlines
        s = s.replace(/\n\n/g, '<br><br>');
        s = s.replace(/\n/g, '<br>');
        
        return s;
    }

    function extractChoices(text) {
        if (!text) return [];
        const choices = [];
        // 1. Извлекаем из JSON блока <!-- CHOICES: [...] -->
        const m = text.match(/<!--\s*CHOICES:\s*(\[.*?\])\s*-->/s);
        if (m) {
            try {
                const arr = JSON.parse(m[1]);
                if (Array.isArray(arr) && arr.length) return arr;
            } catch(e) {}
        }
        // 2. Извлекаем из строк 🔘
        const lines = text.split('\n');
        for (const l of lines) {
            const trimmed = l.trim();
            if (trimmed.startsWith('🔘')) {
                let val = trimmed.replace(/^🔘\s*/, '').replace(/^\[(.*?)\]$/, '$1').trim();
                val = val.replace(/^Вариант\s*\d+\s*:\s*/i, '').trim();
                if (val && !choices.includes(val)) {
                    choices.push(val);
                }
            }
        }
        return choices;
    }

    function renderAiMessage(rawText) {
        const choices = extractChoices(rawText);
        
        // Убираем текстовые варианты выбора из основного тела, чтобы отрендерить их как кнопки
        let cleaned = rawText.replace(/###\s*🎯\s*Выберите следующий шаг:[\s\S]*$/i, '').trim();
        cleaned = cleaned.replace(/<!--\s*CHOICES:[\s\S]*?-->/g, '').trim();
        
        let html = renderMarkdown(cleaned || rawText);
        
        if (choices.length > 0) {
            html += `
                <div class="choices-box">
                    <div class="choices-title">🎯 Выберите следующий шаг (нажмите для запуска):</div>
                    <div class="choices-grid">
                        ${choices.map(c => {
                            const safeDisplay = escapeHtml(c);
                            const jsParam = c.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            return `
                                <button class="choice-btn" onclick="quickSend('${jsParam}')">
                                    <span class="icon">👉</span>
                                    <span>${safeDisplay}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        return `<div class="message-ai">${html}</div>`;
    }

    async function readRepoJson(path) {
        for (const withAuth of [true, false]) {
            for (const ref of ['data', 'main']) {
                try {
                    const data = await ghApi(`/contents/${path}?ref=${ref}`, 'GET', null, withAuth);
                    if (data && data.content) {
                        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
                    }
                } catch (e) {}
            }
        }
        return null;
    }

    async function loadProjects() {
        const list = document.getElementById('project_list');
        const json = await readRepoJson('projects.json');
        if (json && json.projects) {
            allProjects = json.projects;
            renderProjects();
        } else if (!allProjects.length) {
            list.innerHTML = `
                <div style="padding:20px; color:#f87171; text-align:center;">
                    <p style="font-weight:bold; margin-bottom:6px;">⚠️ Загрузка списка папок...</p>
                    <button onclick="loadProjects()" style="background:#3b82f6; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;">Повторить</button>
                </div>
            `;
        }
    }

    async function loadStatus() {
        const el = document.getElementById('laptop_status');
        const json = await readRepoJson('status.json');
        if (!json || !json.last_seen) { el.textContent = '⚪ нет данных связи'; return; }
        const mins = Math.round((Date.now() - new Date(json.last_seen).getTime()) / 60000);
        if (mins <= 5) {
            el.textContent = '🟢 ноутбук на связи';
        } else {
            el.textContent = `🔴 ноутбук не отвечает ${mins < 120 ? mins + ' мин' : Math.round(mins / 60) + ' ч'}`;
        }
    }
    setInterval(() => { loadStatus(); }, 30000);

    function renderProjects() {
        const list = document.getElementById('project_list');
        const q = document.getElementById('project_search').value.trim().toLowerCase();
        const shown = allProjects.filter(p => p.toLowerCase().includes(q));
        document.getElementById('project_count').innerText = `(${shown.length}${q ? ' из ' + allProjects.length : ''})`;
        list.innerHTML = '';
        if (!shown.length) {
            list.innerHTML = '<div class="loading">Ничего не найдено</div>';
            return;
        }
        shown.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project-tab' + (p === currentProject ? ' active' : '');
            div.textContent = '📁 ' + p;
            div.onclick = () => openProject(p, div);
            list.appendChild(div);
        });
    }

    setInterval(() => { loadProjects(); }, 60000);

    let autoRefreshInterval = null;

    function openProject(projName, element) {
        currentProject = projName;
        document.querySelectorAll('.project-tab').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');
        
        document.getElementById('app').classList.add('project-open');
        document.getElementById('workspace_area').style.display = 'flex';
        document.getElementById('current_project_name').textContent = projName;
        
        loadProjectHistory(true);
        
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => loadProjectHistory(false), 4000);
    }

    function closeProject() {
        document.getElementById('app').classList.remove('project-open');
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
        currentProject = '';
        renderProjects();
    }

    function toggleMoreCommands() {
        const el = document.getElementById('extra_suggestions');
        const btn = document.getElementById('toggle_more_btn');
        if (el.classList.contains('show')) {
            el.classList.remove('show');
            btn.innerHTML = '➕ Ещё команды (10) ▼';
        } else {
            el.classList.add('show');
            btn.innerHTML = 'Свернуть ▲';
        }
    }

    function quickSend(cmd) {
        document.getElementById('custom_cmd').value = cmd;
        sendTask();
    }

    function normalizeCmd(raw) {
        const trimmed = raw.trim();
        const lower = trimmed.toLowerCase();
        
        if (lower === 'статус' || lower === 'status' || lower === 'инфо' || lower === 'state') return 'STATUS';
        if (lower === 'что дальше' || lower === 'next' || lower === 'next_steps' || lower === 'дальше') return 'NEXT_STEPS';
        if (lower === 'план' || lower === 'план недели' || lower === 'plan' || lower === 'plan_week') return 'PLAN_WEEK';
        if (lower === 'полный аудит' || lower === 'full' || lower === 'full_audit') return 'FULL_AUDIT';
        if (lower === 'ревью' || lower === 'код' || lower === 'код ревью' || lower === 'audit_code') return 'AUDIT_CODE';
        if (lower === 'безопасность' || lower === 'security' || lower === 'audit_security') return 'AUDIT_SECURITY';
        if (lower === 'баги' || lower === 'ошибки' || lower === 'bugs') return 'BUGS';
        if (lower === 'доки' || lower === 'документация' || lower === 'readme' || lower === 'docs') return 'DOCS';
        if (lower === 'архитектура' || lower === 'arch') return 'ARCH';
        if (lower === 'оптимизация' || lower === 'optimize') return 'OPTIMIZE';
        if (lower === 'маркетинг' || lower === 'воронка' || lower === 'marketing') return 'MARKETING';
        if (lower === 'объясни' || lower === 'разбор' || lower === 'explain') return 'EXPLAIN';
        if (lower === 'файлы' || lower === 'files' || lower === 'ls' || lower === 'dir') return 'FILES';
        if (lower === 'git' || lower === 'гит') return 'GIT';
        if (lower === 'тесты' || lower === 'tests') return 'TESTS';
        if (lower === 'очистка' || lower === 'кэш' || lower === 'cleanup') return 'CLEANUP';
        
        return trimmed;
    }

    let lastRenderedHtml = '';

    async function loadProjectHistory(showLoading = false) {
        if (!currentProject) return;
        const area = document.getElementById('history_area');
        
        if (showLoading) {
            lastRenderedHtml = '';
            area.innerHTML = '<div class="loading">Синхронизация с ноутбуком...</div>';
        }
        
        try {
            const issues = await ghApi('/issues?state=all&per_page=100');
            const projIssues = issues.filter(i => i.title && i.title.includes(`PROJ: ${currentProject}`));
            
            if (projIssues.length === 0) {
                if (showLoading) area.innerHTML = '<div class="loading">Нет истории задач по этому проекту.<br><br>💡 Нажмите <b>🔍 Статус</b> или задайте любой вопрос ниже!</div>';
                return;
            }

            let newHtml = '';
            for (const issue of projIssues) {
                const cmdName = escapeHtml(issue.title.split('|')[0].replace('CMD:', '').trim());
                const isClosed = issue.state === 'closed';
                
                let commentsHtml = '';
                let waitingAgent = false;
                
                if (issue.comments > 0) {
                    try {
                        const comments = await ghApi(`/issues/${issue.number}/comments`);
                        comments.forEach(c => {
                            if (c.body && c.body.includes('ожидает обработки в Antigravity')) waitingAgent = true;
                            commentsHtml += renderAiMessage(c.body);
                        });
                    } catch(ce) {}
                }
                
                if (issue.body && (issue.body.includes('Отчет с домашнего ноутбука') || issue.body.includes('Сводка по проекту') || issue.body.includes('Отчёт с домашнего ноутбука'))) {
                    commentsHtml += renderAiMessage(issue.body);
                }

                let badge = '<span class="badge-open">В обработке ⏳</span>';
                if (isClosed) badge = '<span class="badge-closed">Завершено ✅</span>';
                else if (waitingAgent) badge = '<span class="badge-open" style="background:#e0e7ff; color:#3730a3;">ИИ анализирует 🧠</span>';

                newHtml += `
                    <div class="task-card">
                        <div class="task-header">
                            <span>Задача: ${cmdName}</span>
                            ${badge}
                        </div>
                        <div class="message-user">Вы отправили задачу на ноутбук: "${cmdName}"</div>
                        ${commentsHtml}
                    </div>
                `;
            }
            
            if (newHtml !== lastRenderedHtml) {
                lastRenderedHtml = newHtml;
                area.innerHTML = newHtml;
                area.scrollTop = area.scrollHeight;
            }
        } catch(e) {
            console.error(e);
            if (showLoading) {
                area.innerHTML = `<div style="padding:20px; color:#f87171; text-align:center;">
                    <p style="font-weight:bold; margin-bottom:8px;">Ошибка подключения к GitHub: ${escapeHtml(e.message)}</p>
                    <button onclick="loadProjectHistory(true)" style="background:#3b82f6; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Повторить</button>
                </div>`;
            }
        }
    }

    async function sendTask() {
        const rawCmd = document.getElementById('custom_cmd').value.trim();
        if (!rawCmd || !currentProject) return;
        const cmd = normalizeCmd(rawCmd);
        
        const btn = document.getElementById('send_btn');
        btn.disabled = true; btn.innerText = '⏳';
        
        const area = document.getElementById('history_area');
        const optimisticCard = document.createElement('div');
        optimisticCard.className = 'task-card';
        optimisticCard.innerHTML = `
            <div class="task-header">
                <span>Задача: ${escapeHtml(cmd)}</span>
                <span class="badge-open">Отправка... ⏳</span>
            </div>
            <div class="message-user">Вы отправили задачу: "${escapeHtml(cmd)}"</div>
            <div class="message-ai" style="color:#64748b;">🚀 Задача отправлена в автономный контур ноутбука, обработка...</div>
        `;
        area.appendChild(optimisticCard);
        area.scrollTop = area.scrollHeight;
        
        const issueTitle = `CMD: ${cmd} | PROJ: ${currentProject}`;
        const issueBody = `Задача отправлена с телефона.\nКоманда: ${cmd}`;
        
        try {
            await ghApi('/issues', 'POST', { title: issueTitle, body: issueBody });
            document.getElementById('custom_cmd').value = '';
            
            setTimeout(() => loadProjectHistory(false), 2000);
            setTimeout(() => loadProjectHistory(false), 4500);
            setTimeout(() => loadProjectHistory(false), 8000);
        } catch(e) {
            optimisticCard.remove();
            alert('Ошибка отправки задачи: ' + e.message);
        }
        
        btn.disabled = false; btn.innerText = 'Отправить';
    }
</script>
