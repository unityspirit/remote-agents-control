<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECC Виртуальный Офис</title>
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-muted: #64748b; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); padding: 30px; margin-bottom: 20px; }
        h1, h2, h3 { margin-top: 0; color: var(--text); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: border-color 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        
        #dashboard { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .logout-btn { background: #ef4444; width: auto; padding: 8px 16px; font-size: 14px; }
        .logout-btn:hover { background: #dc2626; }
        
        .status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        .task-list { list-style: none; padding: 0; margin: 0; }
        .task-item { padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-title { font-weight: 600; font-size: 15px; }
        .task-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .badge { padding: 4px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
        .badge-open { background: #fef08a; color: #854d0e; }
        .badge-closed { background: #dcfce7; color: #166534; }
        
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- ECRAN LOGIN -->
    <div id="login_screen" class="card">
        <h1 style="text-align: center; margin-bottom: 30px;">🏢 Вход в Виртуальный Офис</h1>
        <div class="form-group">
            <label>GitHub Token (PAT)</label>
            <input type="password" id="gh_token" placeholder="ghp_...">
        </div>
        <div class="form-group">
            <label>GitHub Репозиторий</label>
            <input type="text" id="gh_repo" placeholder="username/remote-agents-control">
        </div>
        <button onclick="login()">Войти</button>
        <div id="login_status" class="status error"></div>
    </div>

    <!-- ECRAN DASHBOARD -->
    <div id="dashboard">
        <div class="card">
            <div class="header">
                <h2>🏢 Виртуальный Офис</h2>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            
            <h3>Поставить задачу агентам</h3>
            <div class="form-group">
                <label>Выберите проект (папку на ноутбуке):</label>
                <select id="project_select">
                    <option value="">Загрузка проектов...</option>
                </select>
                <div style="font-size:12px; color:#64748b; margin-top:5px;">
                    <a href="#" onclick="loadProjects(); return false;">Обновить список папок</a>
                </div>
            </div>

            <div class="form-group">
                <label>Какую работу выполнить:</label>
                <select id="command_select">
                    <option value="STATUS">Инспекция: Проверить статус проекта</option>
                    <option value="AUDIT_CODE">Аудит: Глубокое ревью кода (Python/JS/Rust...)</option>
                    <option value="AUDIT_SECURITY">Аудит: Проверка безопасности (AgentShield)</option>
                    <option value="PLAN_WEEK">Планирование: Составить архитектурный план</option>
                    <option value="OPTIMIZE">Оптимизация: Найти узкие места в производительности</option>
                </select>
            </div>

            <button id="send_btn" onclick="sendCommand()">🚀 Отправить команду</button>
            <div id="cmd_status" class="status"></div>
        </div>

        <div class="card">
            <h3>Последние задачи</h3>
            <div style="text-align: right; margin-bottom: 10px;">
                <a href="#" style="font-size:13px;" onclick="loadTasks(); return false;">Обновить задачи</a>
            </div>
            <ul class="task-list" id="task_list">
                <li style="text-align:center; color:#64748b; padding:20px;">Загрузка...</li>
            </ul>
        </div>
    </div>
</div>

<script>
    let token = localStorage.getItem('ecc_gh_token') || '';
    let repo = localStorage.getItem('ecc_gh_repo') || '';

    // Init
    if (token && repo) {
        document.getElementById('gh_token').value = token;
        document.getElementById('gh_repo').value = repo;
        showDashboard();
    }

    function login() {
        token = document.getElementById('gh_token').value.trim();
        repo = document.getElementById('gh_repo').value.trim();
        
        if (!token || !repo) {
            const st = document.getElementById('login_status');
            st.innerText = 'Заполните оба поля';
            st.style.display = 'block';
            return;
        }

        localStorage.setItem('ecc_gh_token', token);
        localStorage.setItem('ecc_gh_repo', repo);
        showDashboard();
    }

    function logout() {
        localStorage.removeItem('ecc_gh_token');
        token = '';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login_screen').style.display = 'block';
    }

    function showDashboard() {
        document.getElementById('login_screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadProjects();
        loadTasks();
    }

    async function ghApi(path, method = 'GET', body = null) {
        const headers = {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
        };
        const options = { method, headers };
        if (body) {
            options.body = JSON.stringify(body);
            headers['Content-Type'] = 'application/json';
        }
        
        const res = await fetch(`https://api.github.com/repos/${repo}${path}`, options);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    }

    async function loadProjects() {
        const sel = document.getElementById('project_select');
        sel.innerHTML = '<option value="">Загрузка проектов с ноутбука...</option>';
        try {
            const data = await ghApi('/contents/projects.json');
            const content = decodeURIComponent(escape(atob(data.content)));
            const json = JSON.parse(content);
            sel.innerHTML = '';
            if (json.projects && json.projects.length > 0) {
                json.projects.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.innerText = p;
                    sel.appendChild(opt);
                });
            } else {
                sel.innerHTML = '<option value="">Проекты не найдены</option>';
            }
        } catch (e) {
            sel.innerHTML = '<option value="">Ошибка загрузки (ноутбук еще не отправил список?)</option>';
            console.error(e);
        }
    }

    async function loadTasks() {
        const list = document.getElementById('task_list');
        list.innerHTML = '<li style="text-align:center; color:#64748b; padding:20px;">Загрузка...</li>';
        try {
            const issues = await ghApi('/issues?state=all&per_page=10');
            list.innerHTML = '';
            
            const cmds = issues.filter(i => i.title.startsWith('CMD:'));
            
            if (cmds.length === 0) {
                list.innerHTML = '<li style="text-align:center; color:#64748b; padding:20px;">Нет задач. Отправьте первую!</li>';
                return;
            }

            cmds.forEach(issue => {
                const li = document.createElement('li');
                li.className = 'task-item';
                
                const isClosed = issue.state === 'closed';
                const badge = `<span class="badge ${isClosed ? 'badge-closed' : 'badge-open'}">${isClosed ? 'Выполнено' : 'В процессе'}</span>`;
                
                let title = issue.title.replace('CMD:', '').trim();
                
                li.innerHTML = `
                    <div>
                        <div class="task-title">
                            <a href="${issue.html_url}" target="_blank" style="color:var(--text); text-decoration:none;">${title}</a>
                        </div>
                        <div class="task-meta">Создано: ${new Date(issue.created_at).toLocaleString()}</div>
                    </div>
                    <div>${badge}</div>
                `;
                list.appendChild(li);
            });
        } catch (e) {
            list.innerHTML = `<li style="text-align:center; color:#ef4444; padding:20px;">Ошибка загрузки задач: ${e.message}</li>`;
        }
    }

    async function sendCommand() {
        const project = document.getElementById('project_select').value;
        const cmd = document.getElementById('command_select').value;
        const statusEl = document.getElementById('cmd_status');
        const btn = document.getElementById('send_btn');

        if (!project) {
            statusEl.className = 'status error';
            statusEl.innerText = 'Пожалуйста, выберите проект.';
            statusEl.style.display = 'block';
            return;
        }

        const issueTitle = `CMD: ${cmd} | PROJ: ${project}`;
        const issueBody = `Удаленная команда отправлена из Виртуального Офиса.\n\n**Проект:** ${project}\n**Команда:** ${cmd}\n\n_Ожидание ответа от агентов на ноутбуке..._`;

        statusEl.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner"></div> Отправка...';

        try {
            const data = await ghApi('/issues', 'POST', { title: issueTitle, body: issueBody });
            statusEl.className = 'status success';
            statusEl.innerHTML = `✅ Команда отправлена в очередь агентам! <a href="${data.html_url}" target="_blank">Посмотреть</a>`;
            setTimeout(loadTasks, 2000); // refresh list
        } catch (error) {
            statusEl.className = 'status error';
            statusEl.innerText = `❌ Ошибка сети: ${error.message}`;
        }
        
        statusEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '🚀 Отправить команду';
    }
</script>

</body>
</html>
