name: Cloud Agents 24/7 Autonomous Office

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (auto, study, digest)'
        required: false
        default: 'auto'
      issue_number:
        description: 'Optional specific issue number to execute'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: cloud-agents-24-7-${{ github.repository }}-${{ github.event.issue.number || github.event_name }}
  cancel-in-progress: false

jobs:
  autonomous-cloud-office:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '<!-- cloud-agent-v') && !contains(github.event.comment.body, '<!-- office-ui-auto-note -->')) ||
      github.event_name == 'issues'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/cloud_agent_worker.py
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 24/7 Cloud Autonomous Agents & Office Memory Sync (v34.2 Antigravity 2.31 + Inter-Bot Mesh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GTP_SYNC_TOKEN: ${{ secrets.GTP_SYNC_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_TG_CHAT_ID: ${{ secrets.OWNER_TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          ENABLE_ARGON_ROUTING: "true"
          ENABLE_CARBON_ROUTING: "true"
          GEMINI_ARGON_MODEL: "gemini-4-argon"
          GEMINI_CARBON_MODEL: "gemini-4-carbon"
          GEMINI_HYDROGEN_MODEL: "gemini-4-hydrogen"
          GITHUB_MODELS_FRONTIER: "openai/gpt-4o"
          GITHUB_MODELS_FAST: "openai/gpt-4o-mini"
          GEMINI_THINKING_LEVEL: "high"
          OFFICE_VERSION: "34.2"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
        run: python .github/scripts/cloud_agent_worker.py
